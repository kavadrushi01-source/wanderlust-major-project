# Local "production-like" test run:
#   docker compose up --build
# then open http://localhost:8080
#
# The Cloudinary values are read from your local .env file.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # development (not production) so the login cookie also works on http://localhost
      NODE_ENV: development
      PORT: 8080
      MONGO_URL: mongodb://mongo:27017/wanderlust
      SESSION_SECRET: local-docker-secret-change-me
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
